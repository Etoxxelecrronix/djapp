name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Clean old Gradle caches
        run: rm -rf ~/.gradle/caches/transforms-4/*

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        continue-on-error: true
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: djapp-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build.log
          retention-days: 14

      - name: Check build result
        run: |
          if grep -q "BUILD FAILED" build.log; then
            echo "=== BUILD FAILURE LOG ==="
            grep -A 20 "FAILURE:" build.log | while IFS= read -r line; do echo "::error::$line"; done
            grep -B 5 "Error:" build.log | while IFS= read -r line; do echo "::error::$line"; done
            grep -B 5 "error:" build.log | while IFS= read -r line; do echo "::error::$line"; done
            echo "=== END ==="
            exit 1
          fi
          echo "Build successful"
